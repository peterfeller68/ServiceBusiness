name: Deploy ServiceBusiness Apps to Azure App Service

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_VERSION: 9.0.x
  WEB_PROJECT: src/ServiceBusiness.Web/ServiceBusiness.Web.csproj
  PUBLISH_DIR: ${{ github.workspace }}/publish

jobs:
  build-test-deploy:
    name: Build, test, and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish web app
        run: dotnet publish "${{ env.WEB_PROJECT }}" --configuration Release --no-build --output "${{ env.PUBLISH_DIR }}"

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure PoolShark Azure App Service
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          app-settings-json: |
            [
              {
                "name": "ASPNETCORE_ENVIRONMENT",
                "value": "Production",
                "slotSetting": false
              },
              {
                "name": "SystemSettings__SystemMode",
                "value": "Pool",
                "slotSetting": false
              },
              {
                "name": "SystemSettings__DevTest",
                "value": "false",
                "slotSetting": false
              }
            ]

      - name: Deploy PoolShark to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}

      - name: Configure Landscape Azure App Service
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ vars.AZURE_LANDSCAPE_WEBAPP_NAME }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          app-settings-json: |
            [
              {
                "name": "ASPNETCORE_ENVIRONMENT",
                "value": "Production",
                "slotSetting": false
              },
              {
                "name": "SystemSettings__SystemMode",
                "value": "Landscape",
                "slotSetting": false
              },
              {
                "name": "SystemSettings__DevTest",
                "value": "false",
                "slotSetting": false
              }
            ]

      - name: Deploy Landscape to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_LANDSCAPE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}
