name: Deploy ServiceBusiness Apps to Azure App Service

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_VERSION: 9.0.x
  WEB_PROJECT: src/ServiceBusiness.Web/ServiceBusiness.Web.csproj
  PUBLISH_DIR: ${{ github.workspace }}/publish
  PUBLISH_ZIP: ${{ github.workspace }}/servicebusiness-web.zip

jobs:
  build-test-deploy:
    name: Build, test, and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish web app
        run: dotnet publish "${{ env.WEB_PROJECT }}" --configuration Release --no-build --output "${{ env.PUBLISH_DIR }}"

      - name: Package web app
        run: |
          cd "${{ env.PUBLISH_DIR }}"
          zip -r "${{ env.PUBLISH_ZIP }}" .

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate Azure Web App resource names
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          POOL_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          LANDSCAPE_WEBAPP_NAME: ${{ vars.AZURE_LANDSCAPE_WEBAPP_NAME }}
        run: |
          if [ -z "$AZURE_RESOURCE_GROUP" ]; then
            echo "::error::AZURE_RESOURCE_GROUP is empty. Set it to the Azure resource group containing both App Services."
            exit 1
          fi

          validate_app_name() {
            local variable_name="$1"
            local app_name="$2"

            if [ -z "$app_name" ]; then
              echo "::error::$variable_name is empty. Set it to the Azure App Service resource name."
              exit 1
            fi

            if echo "$app_name" | grep -Eq '^https?://|azurewebsites\.net|/'; then
              echo "::error::$variable_name must be the Azure App Service resource name, not a URL or domain. Use the app resource name shown in Azure Portal, for example LandscapeServiceBusiness."
              exit 1
            fi
          }

          validate_app_name "AZURE_WEBAPP_NAME" "$POOL_WEBAPP_NAME"
          validate_app_name "AZURE_LANDSCAPE_WEBAPP_NAME" "$LANDSCAPE_WEBAPP_NAME"

      - name: Configure PoolShark Azure App Service
        run: |
          az webapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --query name \
            --output tsv

          az webapp config appsettings set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --settings \
              ASPNETCORE_ENVIRONMENT=Production \
              SystemSettings__SystemMode=Pool \
              SystemSettings__DevTest=false

      - name: Deploy PoolShark to Azure App Service
        run: |
          az webapp deploy \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --src-path "${{ env.PUBLISH_ZIP }}" \
            --type zip

      - name: Configure Landscape Azure App Service
        run: |
          az webapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_LANDSCAPE_WEBAPP_NAME }}" \
            --query name \
            --output tsv

          az webapp config appsettings set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_LANDSCAPE_WEBAPP_NAME }}" \
            --settings \
              ASPNETCORE_ENVIRONMENT=Production \
              SystemSettings__SystemMode=Landscape \
              SystemSettings__DevTest=false

      - name: Deploy Landscape to Azure App Service
        run: |
          az webapp deploy \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_LANDSCAPE_WEBAPP_NAME }}" \
            --src-path "${{ env.PUBLISH_ZIP }}" \
            --type zip
